name: OmniTrack CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-db-tests:
    name: Database Schema & RLS Tests (PGlite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test

  admin-web:
    name: Admin Web (Next.js 16 Typecheck & Build)
    runs-on: ubuntu-24.04
    needs: supabase-db-tests
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx next build

  mobile-app:
    name: Mobile App (Expo SDK 57 Typecheck & Bundle)
    runs-on: ubuntu-24.04
    needs: supabase-db-tests
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder-project.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform android

